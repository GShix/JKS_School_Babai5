<!-- Default Avatar SVG - Place this as default-avatar.svg in frontend/public/img/ -->
<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="200" fill="#E5E7EB"/>
  
  <!-- User Icon -->
  <g transform="translate(100, 80)">
    <!-- Head -->
    <circle cx="100" cy="80" r="60" fill="#9CA3AF"/>
    
    <!-- Body -->
    <path d="M 100 140 Q 40 140, 20 240 L 180 240 Q 160 140, 100 140 Z" fill="#9CA3AF"/>
  </g>
</svg>
